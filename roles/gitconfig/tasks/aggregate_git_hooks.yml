---
# Materialize the global git hooks dispatcher.
# Entirely gated on _git_hooks_entries: if no profile declares a git_hooks
# entry, core.hooksPath is never set and nothing is created — see the
# "Conditional activation" section of roles/gitconfig/README.md.

- name: "[🔧 gitconfig] Ensure git hooks directory exists"
  ansible.builtin.file:
    path: "{{ git_hooks_dir }}"
    state: directory
    mode: "0755"
  when: _git_hooks_entries | length > 0

- name: "[🔧 gitconfig] Render dispatcher for each hook name"
  ansible.builtin.template:
    src: hook_dispatcher.sh.j2
    dest: "{{ git_hooks_dir }}/{{ _hook_name }}"
    mode: "0755"
  loop: "{{ git_hooks_all_names }}"
  loop_control:
    loop_var: _hook_name
  vars:
    _hook_global_snippets: >-
      {{ _git_hooks_entries | selectattr('hook', 'equalto', _hook_name)
         | selectattr('scope', 'equalto', 'global') | sort(attribute='order,priority') | list }}
    _hook_trusted_snippets: >-
      {{ _git_hooks_entries | selectattr('hook', 'equalto', _hook_name)
         | selectattr('scope', 'equalto', 'trusted') | sort(attribute='order,priority') | list }}
  when: _git_hooks_entries | length > 0

- name: "[🔧 gitconfig] Write git hooks gitconfig fragment"
  ansible.builtin.copy:
    content: |
      # Auto-generated by gitconfig role - do not edit manually
      [core]
          hooksPath = {{ git_hooks_dir }}
    dest: "{{ git_hooks_gitconfig_file }}"
    mode: "0644"
  when: _git_hooks_entries | length > 0

- name: "[🔧 gitconfig] Find generated hook dispatcher scripts"
  ansible.builtin.find:
    paths: "{{ git_hooks_dir }}"
    file_type: file
    contains: "Auto-generated by gitconfig role"
  register: _generated_hook_scripts
  when: _git_hooks_entries | length > 0

- name: "[🔧 gitconfig] Remove dispatcher scripts for hook names no longer materialized"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _generated_hook_scripts.files | default([]) }}"
  when:
    - _git_hooks_entries | length > 0
    - (item.path | basename) not in git_hooks_all_names

- name: "[🔧 gitconfig] Remove git hooks gitconfig fragment if unused"
  ansible.builtin.file:
    path: "{{ git_hooks_gitconfig_file }}"
    state: absent
  when: _git_hooks_entries | length == 0

- name: "[🔧 gitconfig] Remove git hooks directory if unused"
  ansible.builtin.file:
    path: "{{ git_hooks_dir }}"
    state: absent
  when: _git_hooks_entries | length == 0
